<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>切片工作台</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tutorial.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="tag">SLICE WORKSPACE</div>
          <h1>切片工作台</h1>
        </div>
        <button id="start-tutorial" type="button">使用教程</button>
      </header>
      <label id="drop">将 <strong>.bfslice 或 XY / XZ 五列文本文件</strong> 拖到这里，自动绘图<br><span class="muted">或点击选择文件 · 文件仅在当前浏览器处理</span><br><span class="file-button">选择文件</span><span id="file-name" aria-live="polite">尚未选择文件</span><input id="file" class="file-input" aria-label="选择切片文件" type="file" accept=".bfslice,.dat,.txt,.csv"></label>
      <section id="workspace" aria-label="绘图工作区">
        <div id="status" role="status">等待导入。可直接拖入 .bfslice 切片文件或 XY / XZ 五列文本。</div>
        <fieldset id="controls" disabled>
          <div class="control-grid">
            <details class="control-group" open>
              <summary>显示范围</summary>
              <div class="group-body two-col xyz-ranges">
                <label style="order:0"><span id="x-label">x 范围（格点）</span><span class="row"><input id="xmin" aria-label="x下限" type="number" step="any"><input id="xmax" aria-label="x上限" type="number" step="any"></span></label>
                <label id="vertical-range"><span id="y-label">y 范围（格点）</span><span class="row"><input id="ymin" aria-label="y下限" type="number" step="any"><input id="ymax" aria-label="y上限" type="number" step="any"></span></label>
                <label id="normal-range"><span id="normal-label">z 范围（格点）</span><span class="row"><input id="nmin" aria-label="z下限" type="number" step="any"><input id="nmax" aria-label="z上限" type="number" step="any"></span></label>
                <div class="wide actions"><button id="full">恢复完整范围</button></div>
              </div>
            </details>
            <details class="control-group" open>
              <summary>颜色与色标</summary>
              <div class="group-body two-col">
                <label class="wide">配色<select id="palette"><option value="diverging">蓝—白—红（默认）</option><option value="rainbow">Rainbow · 彩虹</option><option value="viridis">Viridis · 紫—绿—黄</option><option value="inferno">Inferno · 黑—紫—黄</option><option value="gray">灰度 · 黑—白</option><option value="custom">自定义双色</option></select></label>
                <div id="custom-colors" class="wide two-col" hidden>
                  <label>低值颜色<input id="color-low" type="color" value="#2166ac"></label>
                  <label>高值颜色<input id="color-high" type="color" value="#b2182b"></label>
                </div>
                <label>色标下限<input id="cmin" type="number" step="any" value="-1.1"></label>
                <label>色标上限<input id="cmax" type="number" step="any" value="1.1"></label>
                <div class="wide actions"><button id="autoColor">自动对称色标</button></div>
              </div>
            </details>
            <details class="control-group" open>
              <summary>箭头外观</summary>
              <div class="group-body arrow-controls">
                <div class="arrow-numbers">
                  <div>
                    <div class="stride-title">箭头间隔（格；越小越密）</div>
                    <div class="stride-inputs">
                      <label>X<input id="stride-x" aria-label="X方向箭头间隔" type="number" min="1" step="1" value="4"></label>
                      <label>Y<input id="stride-y" aria-label="Y方向箭头间隔" type="number" min="1" step="1" value="4"></label>
                      <label>Z<input id="stride-z" aria-label="Z方向箭头间隔" type="number" min="1" step="1" value="2"></label>
                    </div>
                  </div>
                  <label><span id="scale-label">箭头长度（格 / 单位场）</span><input id="scale" type="number" min="0" step="any" value="2.5"></label>
                </div>
                <label class="arrow-size"><span id="head-label">三维头部大小：1.00 倍</span><input id="head-size" aria-label="三维头部大小" type="range" min="0.25" max="2.5" step="0.05" value="1"></label>
                <label class="arrow-size"><span id="shaft-label">三维柄部粗细：1.00 倍</span><input id="shaft-size" aria-label="三维柄部粗细" type="range" min="0.3" max="5" step="0.1" value="1"></label>
              </div>
            </details>
          </div>
          <div id="mode-note" class="mode-note">范围与选层联动，所有设置实时更新。</div>
        </fieldset>
        <div class="legend">
          <label id="field-control" hidden>显示物理量 <select id="field"></select></label>
          <span id="quantity">z分量</span>
          <span id="lo">−1.1</span>
          <div class="bar" id="colorbar" aria-label="当前配色色标"></div>
          <span id="hi">1.1</span>
          <span id="clipping" class="muted"></span>
        </div>
        <div class="plots" id="plots" aria-label="双图视图">
          <section class="panel">
            <div class="panel-heading">
              <h2 id="planar-title">平面图 / XY</h2>
              <label>左图切面<select id="left-view" disabled><option value="XY">XY 切面</option><option value="XZ">XZ 切面</option></select></label>
            </div>
            <p id="planar-help" class="muted">底色为 z 分量，黑箭头为 (x, y) 分量；拖动框选范围（吸附整数网格边界），移动指针读数。</p>
            <div class="plot-stage">
              <canvas id="planar" width="720" height="650" role="img" aria-label="XY原始格点平面图"></canvas>
            </div>
            <fieldset id="plane-controls" class="under-plot" disabled>
              <label class="plane-control" for="plane"><span id="plane-label">左图 XY 层</span><input id="plane" type="range" min="0" max="0" step="1" value="0" aria-label="左图 XY 层"></label>
              <div class="layer-actions"><button id="full-below" hidden>恢复完整范围</button></div>
            </fieldset>
            <div class="plot-footer">
              <div id="sample"></div>
              <button id="save2">保存平面 PNG</button>
            </div>
          </section>
          <section class="panel">
            <div class="panel-heading">
              <h2>三维视图</h2>
              <label id="voxel-control" hidden>体素分量<select id="voxel-component" aria-label="体素着色分量"><option value="0">px</option><option value="1">py</option><option value="2" selected>pz</option></select></label>
              <label>三维模式<select id="mode3" disabled><option value="arrows">体内箭头</option><option id="box-mode-option" value="box">边界长方体</option><option value="voxels">体素模式（实验性）</option></select></label>
            </div>
            <p id="spatial-help" class="muted">拖动旋转，滚轮缩放。圆锥箭头头部，长度正比于矢量模长。</p>
            <div class="plot-stage">
              <canvas id="spatial" width="720" height="650" role="img" aria-label="多层三维矢量图"></canvas>
            </div>
            <fieldset id="volume-controls" class="under-plot" disabled>
              <div class="layer-control">
                <span id="layer-range-label">三维连续层范围</span>
                <div id="layer-track">
                  <div id="layer-fill"></div>
                  <button type="button" id="layer-start" role="slider" aria-label="三维起始层" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1"></button>
                  <button type="button" id="layer-end" role="slider" aria-label="三维结束层" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1"></button>
                </div>
                <div class="layer-actions"><button id="all">全部层</button> <button id="one">仅左图层</button></div>
              </div>
            </fieldset>
            <div class="plot-footer spatial-footer">
              <p id="info" class="muted"></p>
              <div class="footer-actions"><button id="reset">重置视角</button><button id="save3">保存三维 PNG</button></div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="palettes.js"></script>
    <script src="voxels.js"></script>
    <script src="viewer.js"></script>
    <script src="tutorial-data.js"></script>
    <script id="tutorial-script" src="tutorial.js"></script>
  </body>
</html>
